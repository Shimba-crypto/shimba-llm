[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "shimba-llm"
version = "1.0.0"
description = "One-file LLM trainer for CPU/GPU/Colab/Cloud"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
]
authors = [{name = "Shimba"}]

[project.scripts]
shimba = "shimba:main"

[tool.setuptools.packages.find]
include = ["shimba*"]
